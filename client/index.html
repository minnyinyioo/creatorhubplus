<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#064f4a" />
    <meta name="description" content="CreatorHubPlus — Myanmar creator earnings, payout, account setup and verified address support." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#075f5a" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v3.0.0/dist/cookieconsent.css" />
    <title>creatorhubplus — creator operations studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/plain" data-category="analytics" data-service="Umami" defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    <script src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v3.0.0/dist/cookieconsent.umd.js"></script>
    <script>
      CookieConsent.run({
        cookie: { name: 'creatorhubplus_cookie_consent' },
        categories: {
          necessary: { enabled: true, readOnly: true },
          analytics: { enabled: false }
        },
        guiOptions: {
          consentModal: { layout: 'box inline', position: 'bottom right', equalWeightButtons: true, flipButtons: false },
          preferencesModal: { layout: 'box', position: 'right', equalWeightButtons: true, flipButtons: false }
        },
        language: {
          default: 'en',
          translations: {
            en: {
              consentModal: {
                title: 'Privacy, with a clear path',
                description: 'CreatorHubPlus uses essential cookies to make this site work. With your permission, we also use analytics to understand and improve the experience. Read our <a href="/privacy" class="cc-link">Privacy Policy</a>.',
                acceptAllBtn: 'Accept all',
                acceptNecessaryBtn: 'Reject all',
                showPreferencesBtn: 'Manage preferences'
              },
              preferencesModal: {
                title: 'Cookie preferences',
                acceptAllBtn: 'Accept all',
                acceptNecessaryBtn: 'Reject all',
                savePreferencesBtn: 'Save preferences',
                closeIconLabel: 'Close',
                sections: [
                  {
                    title: 'Your privacy choices',
                    description: 'You can change these choices at any time. Essential cookies keep the site functioning; analytics cookies are optional.'
                  },
                  {
                    title: 'Essential cookies',
                    description: 'Required for core site functions and your saved privacy choice.',
                    linkedCategory: 'necessary'
                  },
                  {
                    title: 'Analytics cookies',
                    description: 'Help us understand which parts of the site are useful, without changing the service you receive.',
                    linkedCategory: 'analytics'
                  }
                ]
              }
            }
          }
        }
      });
    </script>
  </body>
</html>
